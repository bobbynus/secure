name: AI evaluation

# Stage 4 quality gate (plan §7.2): run the AI step on 30-50 real items in a scratch state and print a report.
# Nothing is published and the production state is not touched.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Collection window in days
        type: number
        default: 45
      max:
        description: Events to test
        type: number
        default: 40

permissions:
  contents: read

concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Evaluate
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DAYS: ${{ inputs.days }}
          MAX: ${{ inputs.max }}
        run: |
          [[ "$DAYS" =~ ^[0-9]{1,3}$ && "$MAX" =~ ^[0-9]{1,3}$ ]] || { echo "invalid input"; exit 1; }
          python -m secure_pipeline ai-eval --out "$RUNNER_TEMP/eval" --days "$DAYS" --max "$MAX"
          cat "$RUNNER_TEMP/eval/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "----- report -----"
          cat "$RUNNER_TEMP/eval/report.md"
