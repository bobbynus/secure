name: Collection freshness

# External check of the last successful collection (plan §16). A failed run notifies the repo owner.
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Last successful collection younger than 3 h
        run: |
          set -eu
          curl -fsS --retry 3 https://secure.abramov.vip/api/collector -o status.json
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone, timedelta
          s = json.load(open("status.json"))["status"]
          if not s or not s.get("lastSuccess"):
              sys.exit("no collector status")
          last = datetime.fromisoformat(s["lastSuccess"].replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - last
          print("last success", s["lastSuccess"], "age", age, "ok", s["run"]["ok"], "error", s["run"]["error"])
          for x in s["sources"]:
              if x["state"] == "error":
                  print("::warning::" + x["id"] + ": " + str(x.get("lastError")))
          sys.exit(1 if age > timedelta(hours=3) else 0)
          PY
