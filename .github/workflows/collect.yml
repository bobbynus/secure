name: Collect sources

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 min; GitHub may delay or skip runs — state carries over, nothing is lost
  workflow_dispatch:
    inputs:
      force:
        description: Ignore per-source intervals
        type: boolean
        default: false
      only:
        description: Comma-separated source ids (empty = all)
        type: string
        default: ""

permissions:
  contents: write # push to the pipeline-state branch only

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Check out state branch
        run: |
          git config --global user.name "secure-collector"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pipeline-state >/dev/null; then
            git fetch --depth=1 origin pipeline-state
            git worktree add pipeline/.state FETCH_HEAD
            git -C pipeline/.state switch -c pipeline-state
          else
            git worktree add --orphan -b pipeline-state pipeline/.state
          fi

      - name: Collect
        working-directory: pipeline
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Inputs via env, never interpolated into the script (no command injection).
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          if [ -n "${ONLY:-}" ]; then
            [[ "$ONLY" =~ ^[a-z0-9,-]+$ ]] || { echo "invalid --only"; exit 1; }
            args+=(--only "$ONLY")
          fi
          python -m secure_pipeline --state .state collect "${args[@]}"

      - name: Save state
        run: |
          cd pipeline/.state
          git add -A
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:pipeline-state

      - name: Publish collector status
        if: always()
        working-directory: pipeline
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python -m secure_pipeline --state .state push-status
