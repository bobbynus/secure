name: Pipeline tests

on:
  push:
    branches: [main]
    paths: ["pipeline/**", "data/products.json", "data/sources.json", ".github/workflows/pipeline-ci.yml"]
  pull_request:
    paths: ["pipeline/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements-dev.txt
      - run: cd pipeline && python -m pytest -q
