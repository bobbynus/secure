name: Build and deploy

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "worker/**", "wrangler.jsonc", "package.json", "package-lock.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE: https://secure.abramov.vip
    steps:
      # Third-party actions pinned by commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix site

      - name: Check (types, content schema, worker tests)
        run: |
          npx tsc -p worker
          node --test "worker/test/*.test.ts"
          cd site && npx astro check

      - name: Build site
        run: cd site && npx astro build

      - name: Apply D1 migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply secure-db --remote

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy

      - name: Verify published URLs
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -eu
          sleep 10
          for p in / /ru/ /de/ /en/ /en/rss.xml /api/health; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "$SITE$p"
          done
          # Every language's newest article must be reachable.
          for l in ru de en; do
            url=$(curl -fsS "$SITE/$l/index.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).items[0]?.url ?? ""))')
            if [ -z "$url" ]; then echo "no articles in $l yet"; continue; fi
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "$SITE$url"
            echo "ok $url"
          done

      - name: Dispatch push notifications
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "DISPATCH_TOKEN not set, skipping"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $DISPATCH_TOKEN" "$SITE/api/push/dispatch"
